name: Deploy FastAPI to Server

on:
  push:
    branches: [ main ]
    paths:
      - 'project2/nextjs_fastapi/**'
      - '.github/workflows/deploy-fastapi.yml'
      - 'project2/nextjs_testing/src/app/**'
  workflow_dispatch:  # 允许手动触发

# 安全说明：
# - 所有敏感信息存储在GitHub Secrets中（Settings > Secrets > Actions）
# - Secrets是加密的，不会出现在日志中
# - 建议：使用SSH密钥而非密码，并限制SSH用户权限
# - 建议：在服务器上创建专门的部署用户，只给必要权限

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Build offline deployment bundle
      env:
        HUGHES_GITHUB_TOKEN: ${{ secrets.HUGHES_GITHUB_TOKEN }}
      run: |
        mkdir -p deploy-bundle/wheels
        python -m pip download --only-binary=:all: --dest deploy-bundle/wheels -r project2/nextjs_fastapi/requirements.txt
        python -m pip install --disable-pip-version-check requests==2.31.0
        PYTHONPATH=project2/nextjs_fastapi python - <<'PY'
        import json
        import os
        from pathlib import Path
        from hughes_utils import HughesSync

        messages = HughesSync(os.environ["HUGHES_GITHUB_TOKEN"]).sync_all_entries()
        if not messages:
            raise SystemExit("GitHub archive sync returned no entries")
        output = Path("project2/nextjs_fastapi/processed/hughes_messages.json")
        output.parent.mkdir(parents=True, exist_ok=True)
        output.write_text(json.dumps(messages, ensure_ascii=False, indent=2), encoding="utf-8")
        PY
        cp -R project2/nextjs_fastapi deploy-bundle/nextjs_fastapi
        rm -rf deploy-bundle/nextjs_fastapi/venv deploy-bundle/nextjs_fastapi/__pycache__ deploy-bundle/nextjs_fastapi/routes/__pycache__
        tar -czf fastapi-deploy.tar.gz -C deploy-bundle nextjs_fastapi wheels

    - name: Upload deployment bundle
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: fastapi-deploy.tar.gz
        target: /tmp
    
    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}  # 使用SSH密钥，不用密码
        port: ${{ secrets.SERVER_PORT || 22 }}
        command_timeout: 20m
        script_stop: true
        script: |
          set -e

          mkdir -p ~/apps/tailwind_test/project2
          rm -rf ~/apps/tailwind_test/project2/nextjs_fastapi /tmp/fastapi-deploy
          mkdir -p /tmp/fastapi-deploy
          tar -xzf /tmp/fastapi-deploy.tar.gz -C /tmp/fastapi-deploy
          mv /tmp/fastapi-deploy/nextjs_fastapi ~/apps/tailwind_test/project2/nextjs_fastapi
          cd ~/apps/tailwind_test/project2/nextjs_fastapi
          
          # 删除旧的虚拟环境并重新创建（确保干净的环境）
          rm -rf venv
          python3 -m venv venv
          
          # 用虚拟环境的 python 安装 pip（确保 pip 存在）
          ./venv/bin/python -m ensurepip --upgrade
          
          # 升级 pip 并安装依赖
          ./venv/bin/python -m pip install --no-index --find-links /tmp/fastapi-deploy/wheels -r requirements.txt

          
          # 创建持久配置目录（在项目外）
          sudo mkdir -p /etc/hughes-api

          # 确保评论文件存在（不覆盖已有数据）
          sudo test -f /etc/hughes-api/comments.json || echo '{}' | sudo tee /etc/hughes-api/comments.json > /dev/null
          sudo chmod 644 /etc/hughes-api/comments.json
          
          # 将Token保存到安全位置（不会被git覆盖）
          sudo tee /etc/hughes-api/env > /dev/null << 'EOF'
          GITHUB_TOKEN=${{ secrets.HUGHES_GITHUB_TOKEN }}
          HUGHES_GITHUB_TOKEN=${{ secrets.HUGHES_GITHUB_TOKEN }}
          HUGHES_API_TOKEN=${{ secrets.HUGHES_API_TOKEN }}
          EOF
          
          # 设置权限（只有root可读）
          sudo chmod 600 /etc/hughes-api/env
          sudo chown root:root /etc/hughes-api/env
          
          # 创建或更新systemd服务
          sudo tee /etc/systemd/system/hughes-api.service > /dev/null << 'SERVICE'
          [Unit]
          Description=Hughes API FastAPI Service
          After=network.target
          
          [Service]
          Type=simple
          User=root
          WorkingDirectory=/root/apps/tailwind_test/project2/nextjs_fastapi
          Environment="PATH=/root/apps/tailwind_test/project2/nextjs_fastapi/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          EnvironmentFile=/etc/hughes-api/env
          ExecStart=/root/apps/tailwind_test/project2/nextjs_fastapi/venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8000
          Restart=always
          RestartSec=10
          
          [Install]
          WantedBy=multi-user.target
          SERVICE
          sudo sed -i '/^DRONE_SSH_/d' /etc/systemd/system/hughes-api.service
          
          # 重载并重启服务
          sudo systemctl daemon-reload
          sudo systemctl enable hughes-api
          sudo systemctl restart hughes-api
          
          echo "Deployment completed!"
    
    - name: Check service status
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          # 检查服务状态
          sudo systemctl status hughes-api --no-pager || echo "Service not yet configured"
          
          # 等待服务启动
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              sudo journalctl -u hughes-api -n 100 --no-pager
              exit 1
            fi
            sleep 2
          done
          
          # 测试API端点
          echo "Testing API endpoints..."
          curl -fsS http://localhost:8000/
          sudo bash -c 'set -a; source /etc/hughes-api/env; curl -fsS -H "Authorization: Bearer $HUGHES_API_TOKEN" http://localhost:8000/api/hughes/status'
          
          # 触发数据同步
          echo "Triggering Hughes data sync..."
          sudo bash -c 'set -a; source /etc/hughes-api/env; curl -fsS -H "Authorization: Bearer $HUGHES_API_TOKEN" http://localhost:8000/api/hughes/sync'
          
          # 验证数据是否同步成功
          echo "Verifying data sync..."
          sleep 2
          sudo bash -c 'set -a; source /etc/hughes-api/env; curl -fsS -H "Authorization: Bearer $HUGHES_API_TOKEN" http://localhost:8000/api/hughes/messages > /dev/null'
          
          # 显示最近日志
          echo "Recent logs:"
          sudo journalctl -u hughes-api -n 20 --no-pager
